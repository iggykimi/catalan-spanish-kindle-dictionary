<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diccionario catalán-español para Kindle">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14161a"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b3541e"/>
      <stop offset=".5" stop-color="#e8b64c"/>
      <stop offset="1" stop-color="#8a4a9e"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d3a12"/>
      <stop offset=".55" stop-color="#a3772c"/>
      <stop offset="1" stop-color="#513061"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#sky)"/>

  <!-- back wave -->
  <path d="M0,232 C180,196 340,258 520,236 C700,214 860,168 1040,190 C1160,205 1230,228 1280,222 L1280,320 L0,320 Z"
        fill="url(#waveB)" opacity=".55"/>
  <!-- front wave -->
  <path d="M0,262 C160,238 330,276 520,260 C720,244 900,208 1080,226 C1170,235 1240,250 1280,248 L1280,320 L0,320 Z"
        fill="url(#waveA)" opacity=".85"/>

  <!-- title -->
  <text x="640" y="118" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="58" font-weight="700" letter-spacing="1" fill="#f2f4f6">
    Diccionari català <tspan fill="#e8b64c">→</tspan> español
  </text>

  <!-- subtitle -->
  <text x="640" y="162" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="22" letter-spacing="4" fill="#aab1b8">
    KINDLE · GRATUITO · SIN DRM · CÓDIGO ABIERTO
  </text>
</svg>
