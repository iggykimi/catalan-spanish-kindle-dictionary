  <text x="30" y="140" class="sub">clásico · 1907</text>
  <rect x="330" y="110" width="360" height="18" rx="9" class="track"/>
  <rect x="330" y="110" width="321" height="18" rx="9" fill="#cfa53f"/>
  <text x="700" y="124" class="pct">89,3 %</text>

  <text x="30" y="192" class="lbl">Arrels mortes</text>
